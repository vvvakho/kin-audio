[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kin-audio"
version = "0.1.0"
description = "Open, content-preserving neural audio re-instrumentation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Vakho" }]
dependencies = [
  "gradio>=5.20,<6",
  "numpy>=2.1,<3",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
cpu = ["torch>=2.9,<3"]
cu130 = ["torch>=2.9,<3"]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
kin-audio = "kin_audio.cli:main"
kin-dashboard = "kin_audio.dashboard:main"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.hatch.build.targets.wheel]
packages = ["src/kin_audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
